[package]
name = "atomforge"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "ATOMFORGE: a job runner's core, rebuilt from its incident report"

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[dev-dependencies]
criterion = "0.8"
libc = "0.2"

[[bench]]
name = "locks"
harness = false
